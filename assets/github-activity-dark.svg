<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="GitHub Activity and Consistency">
  <defs>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .header-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }
    .big-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 400;
    }
    .stat-row {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 500;
    }
    .footer-note {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
    }
  </style>

  <!-- CARD 1: LAST 12 MONTHS (LEFT) -->
  <g transform="translate(10, 10)">
    <rect width="420" height="206" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <text x="24" y="32" fill="#2DD4BF" class="header-tag">LAST 12 MONTHS</text>
    
    <!-- Big Contributions Number -->
    <text x="24" y="78" fill="#F0F6FC" class="big-num">6,177</text>
    <text x="24" y="98" fill="#8B949E" class="sub-text">contributions</text>
    
    <!-- Metrics Grid -->
    <g transform="translate(24, 126)" class="stat-row">
      <!-- Col 1 -->
      <text x="0" y="0" fill="#C9D1D9"><tspan font-weight="700">556</tspan> <tspan fill="#8B949E">commits</tspan></text>
      <text x="0" y="20" fill="#C9D1D9"><tspan font-weight="700">78</tspan> <tspan fill="#8B949E">code reviews</tspan></text>

      <!-- Col 2 -->
      <text x="170" y="0" fill="#C9D1D9"><tspan font-weight="700">45</tspan> <tspan fill="#8B949E">pull requests</tspan></text>
      <text x="170" y="20" fill="#C9D1D9"><tspan font-weight="700">277</tspan> <tspan fill="#8B949E">issues</tspan></text>
    </g>

    <!-- Footer Note: Private Repos & Commits -->
    <line x1="24" y1="168" x2="396" y2="168" stroke="#30363D" stroke-width="0.8" opacity="0.6"/>
    <text x="24" y="188" fill="#8B949E" class="footer-note">
      <tspan font-weight="600" fill="#C9D1D9">5,206</tspan> in private repositories · <tspan font-weight="600" fill="#C9D1D9">86</tspan> repos with commits
    </text>
  </g>

  <!-- CARD 2: CONSISTENCY & STREAK (RIGHT) -->
  <g transform="translate(450, 10)">
    <rect width="420" height="206" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <!-- Header -->
    <text x="24" y="32" fill="#2DD4BF" class="header-tag">CONSISTENCY</text>
    
    <!-- Big Streak Number -->
    <text x="24" y="78" fill="#F0F6FC" class="big-num">40 days</text>
    <text x="24" y="98" fill="#8B949E" class="sub-text">current streak</text>
    
    <!-- Consistency Details -->
    <g transform="translate(24, 134)" class="stat-row">
      <text x="0" y="0" fill="#C9D1D9"><tspan font-weight="700">40</tspan> <tspan fill="#8B949E">longest in 12 months</tspan></text>
      <text x="190" y="0" fill="#C9D1D9"><tspan font-weight="700">173</tspan> <tspan fill="#8B949E">active days</tspan></text>
    </g>

    <!-- Activity Sparkline Frequency Bars -->
    <g transform="translate(24, 155)">
      <!-- Timeline axis bar -->
      <line x1="0" y1="36" x2="372" y2="36" stroke="#30363D" stroke-width="1"/>
      
      <!-- Generated Bars representing consistent daily commits -->
      <!-- Low / medium / high activity bars simulating sparkline -->
      <rect x="0" y="30" width="4" height="6" rx="1.5" fill="#1E3A3A"/>
      <rect x="12" y="32" width="4" height="4" rx="1.5" fill="#1E3A3A"/>
      <rect x="24" y="28" width="4" height="8" rx="1.5" fill="#1E3A3A"/>
      <rect x="36" y="32" width="4" height="4" rx="1.5" fill="#1E3A3A"/>
      <rect x="48" y="26" width="4" height="10" rx="1.5" fill="#1E3A3A"/>
      <rect x="60" y="30" width="4" height="6" rx="1.5" fill="#1E3A3A"/>
      <rect x="72" y="22" width="4" height="14" rx="1.5" fill="#1E3A3A"/>
      <rect x="84" y="28" width="4" height="8" rx="1.5" fill="#1E3A3A"/>
      <rect x="96" y="24" width="4" height="12" rx="1.5" fill="#1E3A3A"/>
      <rect x="108" y="18" width="4" height="18" rx="1.5" fill="#1E3A3A"/>
      <rect x="120" y="28" width="4" height="8" rx="1.5" fill="#1E3A3A"/>
      <rect x="132" y="20" width="4" height="16" rx="1.5" fill="#1E3A3A"/>
      <rect x="144" y="14" width="4" height="22" rx="1.5" fill="#2DD4BF"/>
      <rect x="156" y="26" width="4" height="10" rx="1.5" fill="#1E3A3A"/>
      <rect x="168" y="18" width="4" height="18" rx="1.5" fill="#1E3A3A"/>
      <rect x="180" y="12" width="4" height="24" rx="1.5" fill="#2DD4BF"/>
      <rect x="192" y="22" width="4" height="14" rx="1.5" fill="#1E3A3A"/>
      <rect x="204" y="16" width="4" height="20" rx="1.5" fill="#2DD4BF"/>
      <rect x="216" y="8" width="4" height="28" rx="1.5" fill="#2DD4BF"/>
      <rect x="228" y="14" width="4" height="22" rx="1.5" fill="#2DD4BF"/>
      <rect x="240" y="18" width="4" height="18" rx="1.5" fill="#1E3A3A"/>
      <rect x="252" y="10" width="4" height="26" rx="1.5" fill="#2DD4BF"/>
      <rect x="264" y="6" width="4" height="30" rx="1.5" fill="#2DD4BF"/>
      <rect x="276" y="12" width="4" height="24" rx="1.5" fill="#2DD4BF"/>
      <rect x="288" y="4" width="4" height="32" rx="1.5" fill="#2DD4BF"/>
      <rect x="300" y="10" width="4" height="26" rx="1.5" fill="#2DD4BF"/>
      <rect x="312" y="6" width="4" height="30" rx="1.5" fill="#2DD4BF"/>
      <rect x="324" y="2" width="4" height="34" rx="1.5" fill="#2DD4BF"/>
      <rect x="336" y="8" width="4" height="28" rx="1.5" fill="#2DD4BF"/>
      <rect x="348" y="2" width="4" height="34" rx="1.5" fill="#2DD4BF"/>
      <rect x="360" y="0" width="4" height="36" rx="1.5" fill="#2DD4BF"/>
    </g>
  </g>
</svg>