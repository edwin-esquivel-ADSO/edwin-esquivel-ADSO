<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-label="Edwin Esquivel Terminal Profile">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(9, 105, 218, 0.04)" stroke-width="1"/>
    </pattern>
    <clipPath id="leftClip">
      <rect x="36" y="80" width="370" height="394" rx="8"/>
    </clipPath>
  </defs>

  <style>
    @keyframes switchTech {
      0%, 45% { opacity: 1; transform: scale(1); }
      48%, 95% { opacity: 0; transform: scale(0.96); }
      98%, 100% { opacity: 1; transform: scale(1); }
    }
    @keyframes switchTux {
      0%, 45% { opacity: 0; transform: scale(0.96); }
      48%, 95% { opacity: 1; transform: scale(1); }
      98%, 100% { opacity: 0; transform: scale(0.96); }
    }
    @keyframes switchTagTech {
      0%, 45% { opacity: 1; }
      48%, 95% { opacity: 0; }
      98%, 100% { opacity: 1; }
    }
    @keyframes switchTagLinux {
      0%, 45% { opacity: 0; }
      48%, 95% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanlineAnim {
      0% { transform: translateY(-394px); }
      100% { transform: translateY(394px); }
    }
    @keyframes pulseRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tech-core {
      animation: switchTech 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 221px 260px;
    }
    .linux-tux {
      animation: switchTux 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 221px 260px;
    }
    .tag-tech {
      animation: switchTagTech 8s ease infinite;
    }
    .tag-linux {
      animation: switchTagLinux 8s ease infinite;
    }
    .cursor {
      animation: blinkCursor 1s step-end infinite;
    }
    .scanline {
      animation: scanlineAnim 4s linear infinite;
    }
    .rot-ring {
      animation: pulseRing 20s linear infinite;
      transform-origin: 221px 255px;
    }
  </style>

  <!-- Outer Canvas -->
  <rect width="1080" height="520" rx="16" fill="#F6F8FA"/>

  <!-- Terminal Window -->
  <rect x="14" y="14" width="1052" height="492" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Header / Title Bar -->
  <path d="M 14 56 L 1066 56" stroke="#D0D7DE" stroke-width="1.5"/>
  <circle cx="38" cy="35" r="6.5" fill="#FF5F56"/>
  <circle cx="59" cy="35" r="6.5" fill="#FFBD2E"/>
  <circle cx="80" cy="35" r="6.5" fill="#27C93F"/>
  <text x="540" y="40" text-anchor="middle" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="0.5">alejo@stack: ~/profile.yaml (vim)</text>

  <!-- LEFT PANE: DYNAMIC TECH ENGINE & LINUX TUX -->
  <g clip-path="url(#leftClip)">
    <rect x="36" y="80" width="370" height="394" rx="8" fill="#F0F3F6" stroke="#D0D7DE" stroke-width="1"/>
    <rect x="36" y="80" width="370" height="394" fill="url(#grid)"/>

    <!-- Header info in left pane -->
    <path d="M 36 116 L 406 116" stroke="#D0D7DE" stroke-width="1"/>
    <text x="50" y="103" fill="#0969DA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM.VISUAL // ENGINE</text>
    <text x="390" y="103" text-anchor="end" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">FICHA: 3413974</text>

    <!-- Scanning line effect -->
    <line x1="36" y1="80" x2="406" y2="80" stroke="#0969DA" stroke-width="1.5" opacity="0.4" class="scanline"/>

    <!-- VISUAL 1: PURE TECH & CODE ENGINE (TYPESCRIPT / REACT / CODE BADGE) -->
    <g class="tech-core">
      <!-- Glow & Outer Orbiting Rings -->
      <circle cx="221" cy="255" r="95" fill="#0969DA" opacity="0.04"/>
      <circle cx="221" cy="255" r="82" fill="none" stroke="#0969DA" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.45" class="rot-ring"/>
      <circle cx="221" cy="255" r="72" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3"/>

      <!-- Glowing Hexagon Badge for TypeScript/Code Core -->
      <polygon points="221,175 285,212 285,288 221,325 157,288 157,212" fill="#E8EEF5" stroke="#0969DA" stroke-width="2.5"/>
      <polygon points="221,185 275,217 275,283 221,315 167,283 167,217" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.4"/>

      <!-- Central Code & TypeScript Emblem -->
      <!-- < / > Bracket Accents -->
      <path d="M 188 238 L 176 255 L 188 272" fill="none" stroke="#0969DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 254 238 L 266 255 L 254 272" fill="none" stroke="#0969DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="228" y1="235" x2="214" y2="275" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

      <!-- Bold { TS } Tech Monogram -->
      <text x="221" y="263" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="22" font-weight="900" letter-spacing="1">TS</text>

      <!-- Corner Circuit Nodes -->
      <circle cx="157" cy="212" r="4.5" fill="#0969DA"/>
      <circle cx="285" cy="212" r="4.5" fill="#4F46E5"/>
      <circle cx="221" cy="325" r="4.5" fill="#0969DA"/>
      <circle cx="221" cy="175" r="4.5" fill="#4F46E5"/>

      <!-- Sub-label inside hexagon -->
      <text x="221" y="303" text-anchor="middle" fill="#0969DA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9.5" font-weight="700" letter-spacing="1.5">FULL_STACK</text>
    </g>

    <!-- VISUAL 2: ICONIC LINUX TUX (PENGUIN) -->
    <g class="linux-tux">
      <!-- Glow Circle Background -->
      <circle cx="221" cy="255" r="90" fill="#D97706" opacity="0.05"/>
      <circle cx="221" cy="255" r="76" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4"/>

      <!-- Tux Body -->
      <path d="M 221 190 C 200 190, 185 208, 188 238 C 182 250, 172 278, 172 300 C 172 320, 190 324, 221 324 C 252 324, 270 320, 270 300 C 270 278, 260 250, 254 238 C 257 208, 242 190, 221 190 Z" fill="#1F2937" stroke="#0284C7" stroke-width="2"/>

      <!-- Tux Belly -->
      <path d="M 221 230 C 204 230, 194 250, 194 278 C 194 306, 206 318, 221 318 C 236 318, 248 306, 248 278 C 248 250, 238 230, 221 230 Z" fill="#F8FAFC"/>

      <!-- Tux Eyes -->
      <ellipse cx="212" cy="214" rx="5" ry="7" fill="#FFFFFF"/>
      <ellipse cx="230" cy="214" rx="5" ry="7" fill="#FFFFFF"/>
      <circle cx="213" cy="214" r="2.5" fill="#0F172A"/>
      <circle cx="229" cy="214" r="2.5" fill="#0F172A"/>

      <!-- Tux Beak -->
      <path d="M 210 223 C 210 223, 221 235, 232 223 C 230 231, 225 236, 221 236 C 217 236, 212 231, 210 223 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

      <!-- Tux Flippers (Wings) -->
      <path d="M 186 250 C 174 260, 166 280, 168 296 C 172 298, 178 288, 184 275 Z" fill="#1F2937" stroke="#0284C7" stroke-width="1.5"/>
      <path d="M 256 250 C 268 260, 276 280, 274 296 C 270 298, 264 288, 258 275 Z" fill="#1F2937" stroke="#0284C7" stroke-width="1.5"/>

      <!-- Tux Feet -->
      <ellipse cx="196" cy="323" rx="15" ry="7" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
      <ellipse cx="246" cy="323" rx="15" ry="7" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
    </g>

    <!-- Bottom Status in Left Box -->
    <path d="M 36 438 L 406 438" stroke="#D0D7DE" stroke-width="1"/>
    <!-- Animated labels for status -->
    <g class="tag-tech">
      <text x="50" y="458" fill="#0969DA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">● ENGINE: TYPESCRIPT // REACT</text>
      <text x="390" y="458" text-anchor="end" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">ALEJO | STACK</text>
    </g>
    <g class="tag-linux">
      <text x="50" y="458" fill="#D97706" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700">◆ SYSTEM: LINUX_KERNEL_x64</text>
      <text x="390" y="458" text-anchor="end" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10">OPEN_SOURCE</text>
    </g>
  </g>

  <!-- RIGHT PANE: VIM / CODE EDITOR -->
  <g transform="translate(426, 80)">
    <!-- Line numbers & code block -->
    <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5" letter-spacing="0.3">
      
      <!-- Line 1 -->
      <text x="0" y="24" fill="#8C959F" text-anchor="end" width="24">1</text>
      <text x="18" y="24" fill="#0550AE" font-weight="700">profile:</text>

      <!-- Line 2 -->
      <text x="0" y="46" fill="#8C959F" text-anchor="end">2</text>
      <text x="34" y="46"><tspan fill="#4F46E5">subject:</tspan> <tspan fill="#24292F" font-weight="600">"Edwin Alejandro Esquivel"</tspan></text>

      <!-- Line 3 -->
      <text x="0" y="68" fill="#8C959F" text-anchor="end">3</text>
      <text x="34" y="68"><tspan fill="#4F46E5">alias:</tspan> <tspan fill="#24292F">"Alejo | Stack"</tspan></text>

      <!-- Line 4 -->
      <text x="0" y="90" fill="#8C959F" text-anchor="end">4</text>
      <text x="34" y="90"><tspan fill="#4F46E5">role:</tspan> <tspan fill="#116329" font-weight="600">"Full-Stack Software Developer"</tspan></text>

      <!-- Line 5 -->
      <text x="0" y="112" fill="#8C959F" text-anchor="end">5</text>
      <text x="34" y="112"><tspan fill="#4F46E5">education:</tspan> <tspan fill="#24292F">"SENA ADSO · Ficha 3413974"</tspan></text>

      <!-- Line 6 -->
      <text x="0" y="134" fill="#8C959F" text-anchor="end">6</text>
      <text x="34" y="134"><tspan fill="#4F46E5">location:</tspan> <tspan fill="#24292F">"Neiva, Huila · Colombia 🇨🇴"</tspan></text>

      <!-- Line 7 -->
      <text x="0" y="156" fill="#8C959F" text-anchor="end">7</text>
      <text x="34" y="156"><tspan fill="#4F46E5">focus:</tspan> <tspan fill="#116329">"Desarrollo Full-Stack · Hackathones · Innovación"</tspan></text>

      <!-- Line 8 -->
      <text x="0" y="178" fill="#8C959F" text-anchor="end">8</text>

      <!-- Line 9 -->
      <text x="0" y="200" fill="#8C959F" text-anchor="end">9</text>
      <text x="18" y="200" fill="#0550AE" font-weight="700">stack:</text>

      <!-- Line 10 -->
      <text x="0" y="222" fill="#8C959F" text-anchor="end">10</text>
      <text x="34" y="222"><tspan fill="#0969DA">languages:</tspan> <tspan fill="#24292F">[TypeScript, JavaScript, PHP, Go, SQL]</tspan></text>

      <!-- Line 11 -->
      <text x="0" y="244" fill="#8C959F" text-anchor="end">11</text>
      <text x="34" y="244"><tspan fill="#0969DA">frontend:</tspan> <tspan fill="#24292F">[React, Next.js, TailwindCSS, Three.js]</tspan></text>

      <!-- Line 12 -->
      <text x="0" y="266" fill="#8C959F" text-anchor="end">12</text>
      <text x="34" y="266"><tspan fill="#0969DA">backend:</tspan> <tspan fill="#24292F">[Laravel, Node.js, Express, REST APIs]</tspan></text>

      <!-- Line 13 -->
      <text x="0" y="288" fill="#8C959F" text-anchor="end">13</text>
      <text x="34" y="288"><tspan fill="#0969DA">databases:</tspan> <tspan fill="#24292F">[MySQL, PostgreSQL]</tspan></text>

      <!-- Line 14 -->
      <text x="0" y="310" fill="#8C959F" text-anchor="end">14</text>
      <text x="34" y="310"><tspan fill="#0969DA">cloud_devops:</tspan> <tspan fill="#24292F">[Vercel, Docker, Git, GitHub, Linux]</tspan></text>

      <!-- Line 15 -->
      <text x="0" y="332" fill="#8C959F" text-anchor="end">15</text>
      <text x="18" y="332" fill="#0550AE" font-weight="700">flagship_projects:</text>

      <!-- Line 16 -->
      <text x="0" y="354" fill="#8C959F" text-anchor="end">16</text>
      <text x="34" y="354"><tspan fill="#D97706">featured:</tspan> <tspan fill="#24292F">[ViaNova IA, CopyCaess.com]</tspan><tspan fill="#0969DA" class="cursor"> █</tspan></text>

    </g>

    <!-- Vim Statusline -->
    <g transform="translate(0, 372)">
      <rect x="0" y="0" width="620" height="22" rx="4" fill="#EAEFF5"/>
      <text x="10" y="15" fill="#0969DA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700">-- NORMAL --</text>
      <text x="110" y="15" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5">profile.yaml</text>
      <text x="610" y="15" text-anchor="end" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5">16L, 512B · utf-8 · [yaml]</text>
    </g>
  </g>
</svg>